<svg width="550" height="270" viewBox="0 0 550 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
    .bubble-left { fill: #1e293b; }
    .bubble-right { fill: #1e40af; }
    text { fill: #f8fafc; font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sender { fill: #60a5fa; font-size: 11px; font-weight: bold; }
    
    .msg-1 { animation: msg-1 0.5s ease-out forwards; }
    .msg-2 { opacity: 0; animation: msg-2 0.5s 1.5s ease-out forwards; }
    .msg-3 { opacity: 0; animation: msg-3 0.5s 3.0s ease-out forwards; }
    
    @keyframes msg-1 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes msg-2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes msg-3 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .bubble-left { fill: #161b22; }
      .bubble-right { fill: #1f6feb; }
      text { fill: #f0f6fc; }
    }
  </style>
  
  <rect width="550" height="270" rx="12" class="bg" />
  
  <!-- Message 1 -->
  <g class="msg-1">
    <rect x="20" y="20" width="340" height="60" rx="14" class="bubble-left"/>
    <text x="36" y="42" class="sender">Recruiter / Client</text>
    <text x="36" y="63">Hey Shah! What are you building in 2026?</text>
  </g>
  
  <!-- Message 2 -->
  <g class="msg-2">
    <rect x="140" y="98" width="390" height="65" rx="14" class="bubble-right"/>
    <text x="156" y="120" class="sender" fill="#93c5fd">Shah Bakhsh (AI Engineer)</text>
    <text x="156" y="143">Building Agentic AI &amp; RAG with 2,019+ commits! 🤖</text>
  </g>

  <!-- Message 3 -->
  <g class="msg-3">
    <rect x="20" y="180" width="380" height="60" rx="14" class="bubble-left"/>
    <text x="36" y="202" class="sender">Collaborator</text>
    <text x="36" y="223">Awesome! Let's connect &amp; build together 🚀</text>
  </g>
</svg>
