name: SHAH.OS AI Presence - Daily Publisher

on:
  schedule:
    - cron: '17 16 * * *' # 21:17 Pakistan time; schedules can be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shah-os-presence-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish source-grounded AI research and prepare community suggestions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: shah-bakhsh
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          DISCUSSIONS_MODE: optional
        run: python3 scripts/github_presence_agent.py
      - name: Commit daily post and audit log
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/presence/
          if git diff --cached --quiet; then
            echo 'Already published; no changes.'
            exit 0
          fi
          git commit -m 'docs(presence): verified AI daily research brief [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'Daily post successfully pushed to main.'
