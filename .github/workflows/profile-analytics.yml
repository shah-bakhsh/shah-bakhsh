name: Refresh GitHub profile analytics

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-analytics.yml
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Render actual GitHub activity, streaks and languages
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: shah-bakhsh
          cards: overview,contributions,composition,languages,rhythm
          output-dir: assets/analytics
          themes: light,dark
          palette: orange
          commit: true
          commit-message: "chore: update real GitHub profile analytics [skip ci]"
