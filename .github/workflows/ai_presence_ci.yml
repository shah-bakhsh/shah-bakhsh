name: SHAH.OS Presence - Validate

on:
  pull_request:
    paths:
      - 'scripts/github_presence_agent.py'
      - 'tests/test_github_presence_agent.py'
      - '.github/workflows/ai_presence_*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile scripts/github_presence_agent.py
          python -m unittest discover -s tests -p 'test_github_presence_agent.py' -v
