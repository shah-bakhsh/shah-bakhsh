name: Publish Daily GitHub Activity

on:
  schedule:
    # 16:00 UTC = 21:00 PKT. Scheduled workflows may run late.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-github-activity-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Generate accurate daily activity post
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: shah-bakhsh
          TZ_NAME: Asia/Karachi
        run: |
          python3 scripts/publish_daily_activity.py

      - name: Publish activity post when real activity exists
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/activity/
          if git diff --cached --quiet; then
            echo "No new activity post to publish."
            exit 0
          fi
          git commit -m "docs(activity): publish verified daily development update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
