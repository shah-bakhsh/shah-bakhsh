name: Daily Auto-Star AI Repositories

on:
  schedule:
    - cron: "0 12 * * *" # Runs every day at 12:00 PM UTC
  workflow_dispatch:

jobs:
  auto-star:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Auto-Starring Script
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_FOLLOW_PAT }}
        run: |
          python scripts/auto_star_ai_repos.py --limit 10

      - name: Commit & Push Star History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add starred_repos.json || true
          git commit -m "chore: update starred_repos.json history [skip ci]" || true
          git push
