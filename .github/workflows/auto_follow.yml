name: Daily Auto-Follow AI Developers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-follow-history
  cancel-in-progress: false

jobs:
  auto-follow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository with built-in token
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check personal access token configuration
        env:
          FOLLOW_TOKEN: ${{ secrets.AUTO_FOLLOW_PAT }}
        run: |
          if [ -z "$FOLLOW_TOKEN" ]; then
            echo "::error::Missing AUTO_FOLLOW_PAT repository secret. Add a valid classic PAT with user:follow scope, or disable this workflow."
            exit 1
          fi

      - name: Run auto-follow script
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_FOLLOW_PAT }}
        run: python scripts/auto_follow_ai_devs.py --limit 50

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followed_users.json
          if git diff --cached --quiet; then
            echo "No new history to commit."
            exit 0
          fi
          git commit -m "chore: update followed user history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
