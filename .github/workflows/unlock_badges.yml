name: Unlock GitHub Achievements

on:
  workflow_dispatch:

jobs:
  unlock-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_FOLLOW_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Badge Unlocker
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_FOLLOW_PAT }}
        run: |
          python scripts/unlock_badges.py
