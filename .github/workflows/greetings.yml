name: Open Source Greetings Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome Issue Author
        if: github.event.issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueComment = `Hi @${context.actor}! 👋 Thank you for opening an issue in Shah Bakhsh's open-source repository.\n\nYour issue has been received and logged! Feel free to check out our flagship AI projects at [github.com/shah-bakhsh](https://github.com/shah-bakhsh). 🚀`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: issueComment
            });

      - name: Welcome Pull Request Author
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const prComment = `Hi @${context.actor}! 🎉 Thank you for submitting a Pull Request to Shah Bakhsh's repository!\n\nYour code contribution is greatly appreciated and will be reviewed shortly. Stay tuned! 🤖✨`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: prComment
            });
